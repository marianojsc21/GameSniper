name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  harness:
    name: Harness de lógica (test-logic.html)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correr harness con Chrome headless
        run: |
          OUT="$(google-chrome --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=15000 --dump-dom "file://$PWD/test-logic.html" 2>/dev/null)"
          if ! printf '%s' "$OUT" | grep -q '<title>ALL PASS</title>'; then
            echo "::error title=Harness::Fallaron checks del harness"
            printf '%s' "$OUT" | grep -o 'FAIL [^<]*' | head -25
            exit 1
          fi
          PASS_COUNT="$(printf '%s' "$OUT" | grep -o '>PASS [^<]*' | wc -l)"
          echo "✅ Harness: ALL PASS ($PASS_COUNT checks)"
